name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build (defaults to the triggering commit)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true
jobs:
  dsp:
    name: DSP / sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Configure
        run: cmake -S . -B build -DOWL_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  macos:
    name: macOS / universal
    runs-on: macos-14
    timeout-minutes: 30
    env:
      ARTEFACTS: build/openWallLimiter_artefacts/Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign bundles ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openWallLimiter.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openWallLimiter.component"
      - name: Validate VST3
        run: |
          curl --fail --location --silent --show-error -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openWallLimiter.vst3"
      - name: Package
        run: |
          mkdir -p package/VST3 package/AU
          cp -R "$ARTEFACTS/VST3/openWallLimiter.vst3" package/VST3/
          cp -R "$ARTEFACTS/AU/openWallLimiter.component" package/AU/
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 scripts/package_notices.py package
          ditto -c -k --keepParent package openWallLimiter-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openWallLimiter-macOS-universal
          path: openWallLimiter-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macOS
          path: build/screenshots/*.png
  windows:
    name: Windows / x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ARTEFACTS: build/openWallLimiter_artefacts/Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openWallLimiter.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: |
          New-Item -ItemType Directory -Force package/VST3 | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openWallLimiter.vst3" package/VST3/
          $env:GITHUB_SHA = git rev-parse HEAD
          python scripts/package_notices.py package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path package -DestinationPath openWallLimiter-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openWallLimiter-Windows-x64
          path: openWallLimiter-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-Windows
          path: build/screenshots/*.png
