name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build (defaults to the triggering commit)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true
jobs:
  dsp:
    if: false
    name: DSP / sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Configure
        run: cmake -S . -B build -DOWL_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  macos:
    if: false
    name: macOS / universal
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ARTEFACTS: build/openWallLimiter_artefacts/Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign bundles ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openWallLimiter.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openWallLimiter.component"
      - name: Validate VST3
        run: |
          curl --fail --location --silent --show-error -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openWallLimiter.vst3"
      - name: Validate Audio Unit
        run: python3 scripts/validate_au.py "$ARTEFACTS/AU/openWallLimiter.component"
      - name: Package
        run: |
          mkdir -p package/VST3 package/AU
          cp -R "$ARTEFACTS/VST3/openWallLimiter.vst3" package/VST3/
          cp -R "$ARTEFACTS/AU/openWallLimiter.component" package/AU/
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 scripts/package_notices.py package
          ditto -c -k --keepParent package openWallLimiter-macOS-universal.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openWallLimiter-macOS-universal
          path: openWallLimiter-macOS-universal.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-macOS
          path: build/screenshots/*.png
  windows:
    name: Windows / x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ARTEFACTS: build/openWallLimiter_artefacts/Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval.zip SHA-256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openWallLimiter.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: |
          New-Item -ItemType Directory -Force package/VST3 | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openWallLimiter.vst3" package/VST3/
          $env:GITHUB_SHA = git rev-parse HEAD
          python scripts/package_notices.py package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path package -DestinationPath openWallLimiter-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openWallLimiter-Windows-x64
          path: openWallLimiter-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-Windows
          path: build/screenshots/*.png
      - name: Upload preview screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-screenshot
          path: build/screenshots/openWallLimiter.png
          if-no-files-found: error

  update-preview:
    # Refreshes docs/screenshots/preview.png (the image OpenVST Manager shows) from the
    # Windows editor capture on every push to main. The capture is the factory-default
    # patch at the editor's default size.
    #
    # A path filter used to skip the commit unless the push touched Source/, assets/,
    # Tools/, tools/, or Tests/. The v1.9.1 push only changed CMakeLists.txt (the
    # version string drawn in the editor footer), the release workflow, and the notes.
    # The job logged "No UI changes; keeping preview." and left the previous image.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-screenshot
          path: preview
      - name: Commit refreshed preview if changed
        run: |
          mkdir -p docs/screenshots
          cp "preview/openWallLimiter.png" docs/screenshots/preview.png
          if git diff --quiet -- docs/screenshots/preview.png; then echo "Preview unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git push
